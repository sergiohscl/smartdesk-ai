name: smartdesk-ai

secrets:
  METRICS_TOKEN:
    file: ./monitoring/prometheus/secrets/metrics_token
  grafana_admin_password:
    file: ./monitoring/grafana/secrets/admin_password

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: smartdesk
      POSTGRES_USER: smartdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U smartdesk -d smartdesk
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - smartdesk_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: smartdesk-ai-backend:dev
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+asyncpg://smartdesk:${POSTGRES_PASSWORD}@db:5432/smartdesk
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Defina JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-15}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-300}
      AI_MAX_DESCRIPTION_CHARS: ${AI_MAX_DESCRIPTION_CHARS:-4000}
      AI_DAILY_USER_LIMIT: ${AI_DAILY_USER_LIMIT:-20}

    depends_on:
      db:
        condition: service_healthy

    secrets:
      - METRICS_TOKEN

    networks:
      - smartdesk_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1

    image: smartdesk-ai-frontend:dev
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    depends_on:
      - backend

    networks:
      - smartdesk_network

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus

    group_add:
      - "999"

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    secrets:
      - source: METRICS_TOKEN
        target: /etc/prometheus/secrets/metrics_token

    depends_on:
      - backend

    networks:
      - smartdesk_network


  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped

    group_add:
      - "472"

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    secrets:
      - grafana_admin_password

    depends_on:
      - prometheus

    networks:
      - smartdesk_network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  smartdesk_network:
    driver: bridge
