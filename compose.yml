
name: smartdesk-ai

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: smartdesk
      POSTGRES_USER: smartdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U smartdesk -d smartdesk
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - smartdesk_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: smartdesk-ai-backend:dev
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+asyncpg://smartdesk:${POSTGRES_PASSWORD}@db:5432/smartdesk
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Defina JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-15}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-300}
      AI_MAX_DESCRIPTION_CHARS: ${AI_MAX_DESCRIPTION_CHARS:-4000}
      AI_DAILY_USER_LIMIT: ${AI_DAILY_USER_LIMIT:-20}

    depends_on:
      db:
        condition: service_healthy

    networks:
      - smartdesk_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1

    image: smartdesk-ai-frontend:dev
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    depends_on:
      - backend

    networks:
      - smartdesk_network

volumes:
  postgres_data:

networks:
  smartdesk_network:
    driver: bridge
