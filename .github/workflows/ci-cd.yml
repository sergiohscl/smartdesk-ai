name: SMARTDESK AI - CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Ruff and Pytest
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      JWT_SECRET_KEY: ci-only-placeholder-not-for-production

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: python -m pip install "poetry>=2.0,<3.0"

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run Ruff
        run: poetry run ruff check .

      - name: Check Ruff formatting
        run: poetry run ruff format --check .

      - name: Run Pytest
        run: poetry run pytest -v

  frontend:
    name: Frontend - TypeScript, ESLint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker - Build and Publish
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            sergiohscl/smartdesk-ai-backend:latest
            sergiohscl/smartdesk-ai-backend:sha-${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          build-args: |
            VITE_API_URL=/api/v1
          tags: |
            sergiohscl/smartdesk-ai-frontend:latest
            sergiohscl/smartdesk-ai-frontend:sha-${{ github.sha }}
